<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" fill="none" role="img">
  <title>E.D.I.T.H. security ecosystem</title>
  <defs>
    <linearGradient id="h-plate" x1="600" y1="300" x2="600" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9f6ef"/><stop offset="1" stop-color="#d2e9de"/>
    </linearGradient>
    <linearGradient id="h-shield" x1="600" y1="150" x2="600" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d8b6e"/><stop offset="0.55" stop-color="#2f6d56"/><stop offset="1" stop-color="#1a4d3a"/>
    </linearGradient>
    <linearGradient id="h-shieldface" x1="600" y1="150" x2="520" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef8f3"/>
    </linearGradient>
    <radialGradient id="h-glow" cx="600" cy="330" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5aa688" stop-opacity="0.28"/><stop offset="1" stop-color="#5aa688" stop-opacity="0"/>
    </radialGradient>
    <filter id="h-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#15402f" flood-opacity="0.16"/>
    </filter>
    <filter id="h-soft-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#15402f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="860" rx="36" fill="#f7fbf9"/>
  <circle cx="600" cy="330" r="330" fill="url(#h-glow)"/>

  <!-- protective network arcs -->
  <g stroke="#7ebda3" fill="none" opacity="0.5">
    <ellipse cx="600" cy="470" rx="470" ry="190" stroke-dasharray="3 11" stroke-width="2"/>
    <ellipse cx="600" cy="470" rx="350" ry="140" stroke-dasharray="3 11" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- isometric base plate -->
  <g filter="url(#h-soft)">
    <path d="M600 560 L1010 700 L600 840 L190 700 Z" fill="url(#h-plate)"/>
    <path d="M600 560 L1010 700 L600 840 Z" fill="#1a4d3a" opacity="0.06"/>
    <path d="M600 560 L1010 700 L600 840 L190 700 Z" stroke="#a8d5c2" stroke-width="2" fill="none"/>
  </g>
  <!-- plate grid -->
  <g stroke="#9fd0ba" stroke-width="1.5" opacity="0.55">
    <path d="M395 630 L805 770"/><path d="M805 630 L395 770"/>
  </g>

  <!-- connection lines to shield -->
  <g stroke="#5aa688" stroke-width="2.5" opacity="0.75" fill="none">
    <path d="M250 430 C 390 420, 470 400, 540 370"/>
    <path d="M950 430 C 810 420, 730 400, 660 370"/>
    <path d="M300 640 C 420 580, 500 520, 560 452"/>
    <path d="M900 640 C 780 580, 700 520, 640 452"/>
    <path d="M600 712 L600 470"/>
  </g>
  <!-- state dots on the links: trusted / monitored / restricted -->
  <circle cx="420" cy="412" r="7" fill="#3d8b6e"/>
  <circle cx="780" cy="412" r="7" fill="#3d8b6e"/>
  <circle cx="455" cy="560" r="7" fill="#d97706"/>
  <circle cx="745" cy="560" r="7" fill="#dc2626"/>
  <circle cx="600" cy="600" r="7" fill="#3d8b6e"/>

  <!-- central shield -->
  <g filter="url(#h-soft)">
    <path d="M600 150 L742 206 C742 206 742 352 600 432 C458 352 458 206 458 206 Z" fill="url(#h-shield)"/>
    <path d="M600 150 L742 206 C742 206 742 352 600 432 C458 352 458 206 458 206 Z" fill="url(#h-shieldface)"/>
    <path d="M600 150 L742 206 C742 206 742 352 600 432 C458 352 458 206 458 206 Z" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2.5" fill="none"/>
    <!-- keyhole / check mark core -->
    <path d="M545 288 L585 330 L660 248" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- shield pedestal -->
  <ellipse cx="600" cy="470" rx="92" ry="26" fill="#1a4d3a" opacity="0.14"/>

  <!-- ===== device + app nodes ===== -->
  <!-- laptop (left) -->
  <g filter="url(#h-soft-sm)">
    <rect x="150" y="372" width="140" height="92" rx="12" fill="url(#h-node)" stroke="#a8d5c2" stroke-width="2.5"/>
    <rect x="168" y="392" width="104" height="52" rx="6" fill="#d4ede2"/>
    <rect x="132" y="464" width="176" height="14" rx="7" fill="#c4e0d2"/>
  </g>
  <!-- camera (right) -->
  <g filter="url(#h-soft-sm)">
    <rect x="890" y="368" width="150" height="100" rx="16" fill="url(#h-node)" stroke="#a8d5c2" stroke-width="2.5"/>
    <circle cx="965" cy="418" r="30" fill="#d4ede2" stroke="#7ebda3" stroke-width="3"/>
    <circle cx="965" cy="418" r="13" fill="#2f6d56"/>
    <rect x="1008" y="386" width="18" height="10" rx="5" fill="#7ebda3"/>
  </g>
  <!-- smartphone (lower left) -->
  <g filter="url(#h-soft-sm)">
    <rect x="236" y="560" width="92" height="156" rx="18" fill="url(#h-node)" stroke="#a8d5c2" stroke-width="2.5"/>
    <rect x="252" y="584" width="60" height="100" rx="8" fill="#d4ede2"/>
    <circle cx="282" cy="700" r="7" fill="#a8d5c2"/>
  </g>
  <!-- sensor / smart speaker (lower right) -->
  <g filter="url(#h-soft-sm)">
    <rect x="862" y="574" width="106" height="142" rx="24" fill="url(#h-node)" stroke="#a8d5c2" stroke-width="2.5"/>
    <circle cx="915" cy="624" r="22" fill="#d4ede2" stroke="#7ebda3" stroke-width="2.5"/>
    <g stroke="#7ebda3" stroke-width="3" stroke-linecap="round">
      <path d="M893 672 h44"/><path d="M898 688 h34"/>
    </g>
  </g>
  <!-- app tile (bottom center) -->
  <g filter="url(#h-soft-sm)">
    <rect x="540" y="688" width="120" height="120" rx="26" fill="url(#h-node)" stroke="#a8d5c2" stroke-width="2.5"/>
    <rect x="570" y="718" width="60" height="60" rx="14" fill="#d4ede2"/>
    <circle cx="600" cy="748" r="14" fill="#3d8b6e"/>
  </g>

  <!-- floating permission chips -->
  <g filter="url(#h-soft-sm)">
    <rect x="352" y="214" width="112" height="46" rx="23" fill="#ffffff" stroke="#c4e0d2" stroke-width="2"/>
    <circle cx="380" cy="237" r="10" fill="#3d8b6e"/>
    <rect x="398" y="230" width="48" height="8" rx="4" fill="#c4e0d2"/>
  </g>
  <g filter="url(#h-soft-sm)">
    <rect x="740" y="190" width="112" height="46" rx="23" fill="#ffffff" stroke="#c4e0d2" stroke-width="2"/>
    <circle cx="768" cy="213" r="10" fill="#d97706"/>
    <rect x="786" y="206" width="48" height="8" rx="4" fill="#c4e0d2"/>
  </g>
  <g filter="url(#h-soft-sm)">
    <rect x="806" y="286" width="112" height="46" rx="23" fill="#ffffff" stroke="#c4e0d2" stroke-width="2"/>
    <circle cx="834" cy="309" r="10" fill="#dc2626"/>
    <rect x="852" y="302" width="48" height="8" rx="4" fill="#c4e0d2"/>
  </g>
</svg>
